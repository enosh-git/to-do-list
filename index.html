<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="container">
    <header>
      <h1>To Do List</h1>
    </header>

    <!-- Main section -->
     <main>
      <!-- Section for not started tasks -->
      <section class="task-section not-started">
        <h2>Not Started</h2>
        <ul id="notStartedList"></ul>
      </section>

      <!-- Section for pending tasks -->
      <section class="task-section pending">
        <h2>Pending</h2>
        <ul id="pendingList"></ul>
      </section>

      <!-- Section for finished tasks -->
      <section class="task-section finished">
        <div class="finish-div">
          <h2>Finished</h2>
          <button id="clearBtn">Clear Finished Tasks</button>
        </div>
        <ul id="finishedList"></ul>
      </section>

      <!-- Input section -->
      <div class="input-section">
        <input type="text" id="inputText" placeholder="Input a task to do..">
        <button type="button" id="inputButton">Submit</button>
      </div>
     </main>

     <script src="script.js"></script>
  </body>
</html>
